    <!DOCTYPE html>
<html>
<head>
  <title>Register | ConfPro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Conference management platform</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="speakers.html">Speakers</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </header>

  <div class="hero">
    <h1>Register for the Conference</h1>
    <p>Fill in the form to reserve your seat</p>
  </div>

  <div class="form-box">
    <form id="regForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit number" required>

      <label for="type">Registration Type</label>
      <select id="type">
        <option>Student</option>
        <option>Professional</option>
        <option>Author / Speaker</option>
      </select>

      <label for="msg">Message (optional)</label>
      <textarea id="msg" rows="4"></textarea>

      <button type="submit" class="btn">Submit Registration</button>
        <p id="successMsg" class="success-msg">
    </form>
  </div>

  <footer>
    <p>Conference Management Platform</p>
  </footer>

</body>
</html>
</body>
</html>
